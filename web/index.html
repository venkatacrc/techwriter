<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f55c9">
    <meta name="description" content="A 12-week practice program for technical writing about GPUs, training, inference, reinforcement learning and systems.">
    <title>Techwriter</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <button class="icon-btn" id="open-drawer" aria-label="Contents and options">☰</button>
            <div class="brand"><span class="mark">¶</span> Techwriter</div>
            <button class="icon-btn" id="open-search" aria-label="Search" title="Search">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
                </svg>
            </button>
        </header>
        <div class="switches">
            <div class="segmented" id="view-switch"></div>
        </div>
        <div class="status" id="status"></div>
        <main id="stage"></main>
        <nav class="actions" id="actions"></nav>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
            <div class="brand"><span class="mark">¶</span> Techwriter</div>
            <button class="icon-btn" id="close-drawer" aria-label="Close">✕</button>
        </div>
        <div class="drawer-search">
            <input type="search" id="search" placeholder="Search every page" autocomplete="off" aria-label="Search">
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-foot" id="drawer-foot"></div>
    </aside>

    <dialog id="help-dialog">
        <div class="dialog-body">
            <h2>Shortcuts</h2>
            <p>On a phone, swipe the page left or right to move between pages.</p>
            <table class="keys">
                <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Previous / next page</td></tr>
                <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Today, Weeks, Drills, Library</td></tr>
                <tr><td><kbd>T</kbd></td><td>Start or stop the drill timer</td></tr>
                <tr><td><kbd>D</kbd></td><td>Mark done</td></tr>
                <tr><td><kbd>/</kbd></td><td>Search</td></tr>
                <tr><td><kbd>Esc</kbd></td><td>Close the drawer, or leave the writing box</td></tr>
            </table>
        </div>
        <form method="dialog" class="dialog-actions"><button class="btn primary">Close</button></form>
    </dialog>
    <input type="file" id="import-file" accept="application/json" hidden>
    <div class="toast" id="toast" hidden></div>

    <script src="app.js"></script>
</body>
</html>
